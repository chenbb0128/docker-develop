      args:
        - JAVA_VERSION=${JAVA_VERSION}
        - MAVEN_VERSION=${MAVEN_VERSION}
        - MAVEN_MIRROR=${MAVEN_MIRROR}
        - PUID=${JAVA_PUID}
        - PGID=${JAVA_PGID}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    working_dir: ${CONTAINER_PROJECT_PATH}
    command: tail -f /dev/null
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - maven-cache:/home/developer/.m2
      - gradle-cache:/home/developer/.gradle
    environment:
      - TZ=${TIMEZONE}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}
      - MAVEN_OPTS=${MAVEN_OPTS}
    ports:
      - "${JAVA_HOST_PORT}:8080"
      - "${JAVA_DEBUG_PORT}:5005"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    tty: true
    networks:
      - frontend
      - backend

#---------------------------------------------
# Web Server
#---------------------------------------------

### NGINX Server #########################################
  nginx:
    build:
      context: ./services/nginx
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - PHP_UPSTREAM_CONTAINER=${NGINX_PHP_UPSTREAM_CONTAINER}
        - PHP_UPSTREAM_PORT=${NGINX_PHP_UPSTREAM_PORT}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    environment:
      - PHP_UPSTREAM_CONTAINER=${NGINX_PHP_UPSTREAM_CONTAINER}
      - PHP_UPSTREAM_PORT=${NGINX_PHP_UPSTREAM_PORT}
    volumes:
      - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
      - ${NGINX_SITES_PATH}:/etc/nginx/sites
      - ${NGINX_SSL_PATH}:/etc/nginx/ssl
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/services/nginx/startup.sh:/opt/startup.sh
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/docker-panel:/var/www/docker-panel
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"
      - "${NGINX_HOST_HTTPS_PORT}:443"
      - "7001:7001"
      - "7002:7002"
      - "8002:8002"
    depends_on:
      - php83-fpm
      - redis
    networks:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

#---------------------------------------------
# 数据存储服务
#---------------------------------------------

### MySQL ################################################
  mysql:
    build:
      context: ./services/mysql
      args:
        - MYSQL_VERSION=${MYSQL_VERSION}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - ${DATA_PATH}/mysql:/var/lib/mysql
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

