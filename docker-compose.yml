#---------------------------------------------
# Go Development Environment
#---------------------------------------------

### Go Development ########################################
  go:
    build:
      context: ./services/go
      args:
        - GO_VERSION=${GO_VERSION}
        - GOPROXY=${GOPROXY}
        - PUID=${GO_PUID}
        - PGID=${GO_PGID}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
        - INSTALL_DELVE=${GO_INSTALL_DELVE}
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    working_dir: ${CONTAINER_PROJECT_PATH}
    command: tail -f /dev/null
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/developer/.cache/go-build
    environment:
      - GO111MODULE=on
      - GOPROXY=${GOPROXY}
      - CGO_ENABLED=${GO_CGO_ENABLED}
      - TZ=${TIMEZONE}
    ports:
      - "${GO_HOST_PORT}:8080"
      - "${GO_DEBUG_PORT}:2345"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    tty: true
    networks:
      - frontend
      - backend


#---------------------------------------------
# Web Server
#---------------------------------------------

### NGINX Server #########################################
  nginx:
    build:
      context: ./services/nginx
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    volumes:
      - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
      - ${NGINX_SITES_PATH}:/etc/nginx/sites
      - ${NGINX_SSL_PATH}:/etc/nginx/ssl
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/services/nginx/startup.sh:/opt/startup.sh
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/docker-panel:/var/www/docker-panel
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"
      - "${NGINX_HOST_HTTPS_PORT}:443"
      - "7001:7001"
      - "7002:7002"
      - "8002:8002"
    networks:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

#---------------------------------------------
# Data services
#---------------------------------------------

### MySQL ################################################
  mysql:
    build:
      context: ./services/mysql
      args:
        - MYSQL_VERSION=${MYSQL_VERSION}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - ${DATA_PATH}/mysql:/var/lib/mysql
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

