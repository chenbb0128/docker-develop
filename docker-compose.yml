networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}

volumes:
  elasticsearch:
    driver: ${VOLUMES_DRIVER}
  go-mod-cache:
    driver: ${VOLUMES_DRIVER}
  go-build-cache:
    driver: ${VOLUMES_DRIVER}

services:
#---------------------------------------------
# Docker Panel (Go)
#---------------------------------------------

### Docker Panel #########################################
  docker-panel:
    build:
      context: ./docker-panel
      dockerfile: Dockerfile.panel-go
    volumes:
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/docker-panel:/var/www/docker-panel
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DEVELOP_HOST_PATH:-.}:/var/www/docker-develop
      # Docker inspect exposes the engine-side paths, including WSL2 bind mappings.
      - type: bind
        source: ${HOST_PROJECT_PATH}
        target: /var/run/docker-develop/host-paths/HOST_PROJECT_PATH
        read_only: true
        bind:
          create_host_path: false
      - ${DATA_PATH}:/var/run/docker-develop/host-paths/DATA_PATH:ro
      - ${NGINX_HOST_LOG_PATH}:/var/run/docker-develop/host-paths/NGINX_HOST_LOG_PATH:ro
      - ${NGINX_SITES_PATH}:/var/run/docker-develop/host-paths/NGINX_SITES_PATH:ro
      - ${NGINX_SSL_PATH}:/var/run/docker-develop/host-paths/NGINX_SSL_PATH:ro
      - ${MYSQL_ENTRYPOINT_INITDB}:/var/run/docker-develop/host-paths/MYSQL_ENTRYPOINT_INITDB:ro
    working_dir: /var/www/docker-panel
    command: docker-panel-go
    environment:
      - PANEL_LISTEN_ADDR=0.0.0.0:9501
      - PANEL_PROJECT_ROOT=/var/www/docker-develop
      - PANEL_WEB_DIR=/var/www/docker-panel/public
      - PANEL_STATE_DIR=/var/www/docker-panel/runtime
      - PANEL_ENV_FILE=/var/www/docker-develop/.env
      - PANEL_TASK_BUILD_TIMEOUT=30m
    ports:
      - "127.0.0.1:9501:9501"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      - frontend
      - backend

# BEGIN Go project: go-hoodly-joy-go

  go-hoodly-joy-go:
    build:
      context: ./services/go
      args:
        - GO_VERSION=${GO_VERSION}
        - GOPROXY=${GOPROXY}
        - PUID=${GO_PUID}
        - PGID=${GO_PGID}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
        - INSTALL_DELVE=${GO_INSTALL_DELVE}
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    working_dir: '/develop/Hua/Projects/hoodly-joy/go-service'
    command: sh -c 'export PATH=/go/bin:/usr/local/go/bin:$$PATH; PORT=$${PORT:-8080}; export PORT; SERVER_PORT=$${SERVER_PORT:-$$PORT}; export SERVER_PORT; if [ ! -f go.mod ]; then echo "go.mod not found"; exit 1; fi; go mod download; if [ -f main.go ]; then exec go run .; elif [ -d cmd/server ]; then exec go run ./cmd/server; elif [ -d cmd/api ]; then exec go run ./cmd/api; elif [ -d cmd/app ]; then exec go run ./cmd/app; else MAIN_PACKAGE=$$(go list -f "{{if eq .Name \"main\"}}{{.ImportPath}}{{end}}" ./... 2>/dev/null | sed -n "/./{p;q;}"); if [ -z "$$MAIN_PACKAGE" ]; then echo "No Go main package found"; exit 1; fi; exec go run "$$MAIN_PACKAGE"; fi'
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/developer/.cache/go-build
    environment:
      - TZ=${TIMEZONE}
      - GO111MODULE=on
      - GOPROXY=${GOPROXY}
      - CGO_ENABLED=${GO_CGO_ENABLED}
      - PORT=8080
      - SERVER_PORT=8080
      - APP_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "8004:8080"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    tty: true
    networks:
      - frontend
      - backend
# END Go project: go-hoodly-joy-go


