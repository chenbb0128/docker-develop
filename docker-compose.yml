      - TZ=${TIMEZONE}
      - GO111MODULE=on
      - GOPROXY=${GOPROXY}
      - CGO_ENABLED=${GO_CGO_ENABLED}
      - PORT=8080
      - SERVER_PORT=8080
      - APP_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "18081:8080"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    tty: true
    networks:
      - frontend
      - backend
# END Go project: go-edusystem-v2-api


