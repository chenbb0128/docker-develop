networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}

volumes:
  elasticsearch:
    driver: ${VOLUMES_DRIVER}
  go-mod-cache:
    driver: ${VOLUMES_DRIVER}
  go-build-cache:
    driver: ${VOLUMES_DRIVER}
  maven-cache:
    driver: ${VOLUMES_DRIVER}
  gradle-cache:
    driver: ${VOLUMES_DRIVER}

#---------------------------------------------
# YAML Extension Fields (共享配置锚点)
#---------------------------------------------
x-php-fpm-common: &php-fpm-common
  build:
    context: ./services/php-fpm
    args: &php-fpm-build-args
      - CHANGE_SOURCE=${CHANGE_SOURCE}
      - INSTALL_XDEBUG=${PHP_FPM_INSTALL_XDEBUG}
      - XDEBUG_PORT=${PHP_FPM_XDEBUG_PORT}
      - INSTALL_MONGO=${PHP_FPM_INSTALL_MONGO}
      - INSTALL_PHPREDIS=${PHP_FPM_INSTALL_PHPREDIS}
      - INSTALL_MEMCACHED=${PHP_FPM_INSTALL_MEMCACHED}
      - INSTALL_OPCACHE=${PHP_FPM_INSTALL_OPCACHE}
      - INSTALL_EXIF=${PHP_FPM_INSTALL_EXIF}
      - INSTALL_MYSQLI=${PHP_FPM_INSTALL_MYSQLI}
      - INSTALL_PDO_MYSQL=${PHP_FPM_INSTALL_PDO_MYSQL}
      - INSTALL_SWOOLE=${PHP_FPM_INSTALL_SWOOLE}
      - INSTALL_IMAGE_OPTIMIZERS=${PHP_FPM_INSTALL_IMAGE_OPTIMIZERS}
      - INSTALL_IMAGEMAGICK=${PHP_FPM_INSTALL_IMAGEMAGICK}
      - INSTALL_FFMPEG=${PHP_FPM_FFMPEG}
      - INSTALL_PHALCON=${PHP_FPM_INSTALL_PHALCON}
      - PHALCON_VERSION=${PHALCON_VERSION}
      - INSTALL_PING=${PHP_FPM_INSTALL_PING}
      - INSTALL_PHPDECIMAL=${PHP_FPM_INSTALL_PHPDECIMAL}
      - PUID=${PHP_FPM_PUID}
      - PGID=${PHP_FPM_PGID}
      - IMAGEMAGICK_VERSION=${PHP_FPM_IMAGEMAGICK_VERSION}
      - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
      - INSTALL_COMPOSER=${INSTALL_COMPOSER}
  expose:
    - "9000"
  extra_hosts:
    - "dockerhost:${DOCKER_HOST_IP}"
  networks:
    - backend

services:
#---------------------------------------------
# Workspace 开发工具容器
#---------------------------------------------

### Workspace Utilities ##################################
  workspace:
    build:
      context: ./services/workspace
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - PHP_VERSION=${WORKSPACE_PHP_VERSION}
        - INSTALL_XDEBUG=false
        - XDEBUG_PORT=${WORKSPACE_XDEBUG_PORT}
        - INSTALL_MONGO=${WORKSPACE_INSTALL_MONGO}
        - INSTALL_PHPREDIS=${WORKSPACE_INSTALL_PHPREDIS}
        - INSTALL_SWOOLE=${WORKSPACE_INSTALL_SWOOLE}
        - INSTALL_COMPOSER=${WORKSPACE_INSTALL_COMPOSER}
        - COMPOSER_VERSION=${WORKSPACE_COMPOSER_VERSION}
        - COMPOSER_REPO_PACKAGIST=${WORKSPACE_COMPOSER_REPO_PACKAGIST}
        - INSTALL_NODE=${WORKSPACE_INSTALL_NODE}
        - NODE_VERSION=${WORKSPACE_NODE_VERSION}
        - INSTALL_SUPERVISOR=${WORKSPACE_INSTALL_SUPERVISOR}
        - SHELL_OH_MY_ZSH=${SHELL_OH_MY_ZSH}
        - PUID=${WORKSPACE_PUID}
        - PGID=${WORKSPACE_PGID}
        - TZ=${TIMEZONE}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/services/workspace/supervisord.d:/etc/supervisor/conf.d
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    tty: true
    networks:
      - frontend
      - backend





# BEGIN Hyperf project: hyperf-classmateserver

  hyperf-classmateserver:
    build:
      context: ./services/workspace
      args:
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - PHP_VERSION=8.3
        - INSTALL_XDEBUG=${WORKSPACE_INSTALL_XDEBUG}
        - XDEBUG_PORT=${WORKSPACE_XDEBUG_PORT}
        - INSTALL_MONGO=${WORKSPACE_INSTALL_MONGO}
        - INSTALL_PHPREDIS=${WORKSPACE_INSTALL_PHPREDIS}
        - INSTALL_SWOOLE=${WORKSPACE_INSTALL_SWOOLE}
        - INSTALL_COMPOSER=${WORKSPACE_INSTALL_COMPOSER}
        - COMPOSER_VERSION=${WORKSPACE_COMPOSER_VERSION}
        - COMPOSER_REPO_PACKAGIST=${WORKSPACE_COMPOSER_REPO_PACKAGIST}
        - INSTALL_NODE=${WORKSPACE_INSTALL_NODE}
        - NODE_VERSION=${WORKSPACE_NODE_VERSION}
        - INSTALL_SUPERVISOR=${WORKSPACE_INSTALL_SUPERVISOR}
        - SHELL_OH_MY_ZSH=${SHELL_OH_MY_ZSH}
        - PUID=${WORKSPACE_PUID}
        - PGID=${WORKSPACE_PGID}
        - TZ=${TIMEZONE}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
    working_dir: '/develop/Hua/Projects/ClassMate/ClassMateServer'
    command: sh -lc 'git config --global --add safe.directory "$$PWD" 2>/dev/null || true; if [ -f composer.json ] && [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi; if [ ! -f bin/hyperf.php ]; then echo "Hyperf entry file missing."; echo "Check HOST_PROJECT_PATH in .env and the project path."; exit 66; fi; if php bin/hyperf.php list 2>/dev/null | grep -q "server:watch"; then php bin/hyperf.php server:watch; else php bin/hyperf.php start; fi'
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "9502:9501"
    depends_on:
      - redis
    tty: true
    networks:
      - frontend
      - backend
# END Hyperf project: hyperf-classmateserver


# BEGIN Java project: java-hoodly-joy-service

  java-hoodly-joy-service:
    build:
      context: ./services/java
      args:
        - JAVA_VERSION=${JAVA_VERSION}
        - MAVEN_VERSION=${MAVEN_VERSION}
        - MAVEN_MIRROR=${MAVEN_MIRROR}
        - PUID=${JAVA_PUID}
        - PGID=${JAVA_PGID}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
    working_dir: '/develop/Hua/Projects/hoodly-joy/hoodly-joy-service'
    command: sh -lc 'export SERVER_PORT=8003; export PORT=8003; PORT=$${SERVER_PORT:-8080}; if [ -f pom.xml ]; then mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=$$PORT; elif [ -f ./mvnw ]; then tr -d "\015" < ./mvnw > /tmp/project-mvnw && chmod +x /tmp/project-mvnw && sh /tmp/project-mvnw spring-boot:run -Dspring-boot.run.arguments=--server.port=$$PORT; elif [ -f ./gradlew ]; then tr -d "\015" < ./gradlew > /tmp/project-gradlew && chmod +x /tmp/project-gradlew && sh /tmp/project-gradlew bootRun --args=--server.port=$$PORT; else echo "No pom.xml, mvnw, or gradlew found"; exit 1; fi'
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - maven-cache:/home/developer/.m2
      - gradle-cache:/home/developer/.gradle
    environment:
      - TZ=${TIMEZONE}
      - SERVER_PORT=8003
      - PORT=8003
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}
      - MAVEN_OPTS=${MAVEN_OPTS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    ports:
      - "8003:8003"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    tty: true
    networks:
      - frontend
      - backend
# END Java project: java-hoodly-joy-service

#---------------------------------------------
# Docker 管理面板 (Hyperf + Swoole)
#---------------------------------------------

### Docker Panel #########################################
  docker-panel:
    build:
      context: ./docker-panel
      dockerfile: Dockerfile
      args:
        - DOCKER_PANEL_PHP_IMAGE=${DOCKER_PANEL_PHP_IMAGE:-php:8.3-cli-alpine}
        - DOCKER_PANEL_COMPOSER_IMAGE=${DOCKER_PANEL_COMPOSER_IMAGE:-composer:2}
        - COMPOSER_REPO_PACKAGIST=${WORKSPACE_COMPOSER_REPO_PACKAGIST}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    volumes:
      - ${DOCKER_DEVELOP_HOST_PATH:-.}/docker-panel:/var/www/docker-panel
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DEVELOP_HOST_PATH:-.}:/var/www/docker-develop
    working_dir: /var/www/docker-panel
    command: sh -lc 'tr -d "\r" < start-panel.sh > /tmp/start-panel.sh && exec sh /tmp/start-panel.sh'
    ports:
      - "127.0.0.1:9501:9501"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      - frontend
      - backend

