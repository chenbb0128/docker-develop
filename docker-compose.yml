### Redis ################################################
  redis:
    build:
      context: ./services/redis
      args:
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    volumes:
      - ${DATA_PATH}/redis:/data
    command: --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

