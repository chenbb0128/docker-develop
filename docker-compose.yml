# BEGIN Go project: go-hoodly-joy-go

  go-hoodly-joy-go:
    build:
      context: ./services/go
      args:
        - GO_VERSION=${GO_VERSION}
        - GOPROXY=${GOPROXY}
        - PUID=${GO_PUID}
        - PGID=${GO_PGID}
        - CONTAINER_PROJECT_PATH=${CONTAINER_PROJECT_PATH}
        - INSTALL_DELVE=${GO_INSTALL_DELVE}
        - CHANGE_SOURCE=${CHANGE_SOURCE}
        - BASE_IMAGE_REGISTRY=${BASE_IMAGE_REGISTRY}
    working_dir: '/develop/Hua/Projects/hoodly-joy/go-service'
    command: sh -c 'export PATH=/go/bin:/usr/local/go/bin:$$PATH; PORT=$${PORT:-8080}; export PORT; SERVER_PORT=$${SERVER_PORT:-$$PORT}; export SERVER_PORT; if [ ! -f go.mod ]; then echo "go.mod not found"; exit 1; fi; go mod download; if [ -f main.go ]; then exec go run .; elif [ -d cmd/server ]; then exec go run ./cmd/server; elif [ -d cmd/api ]; then exec go run ./cmd/api; elif [ -d cmd/app ]; then exec go run ./cmd/app; else MAIN_PACKAGE=$$(go list -f "{{if eq .Name \"main\"}}{{.ImportPath}}{{end}}" ./... 2>/dev/null | sed -n "/./{p;q;}"); if [ -z "$$MAIN_PACKAGE" ]; then echo "No Go main package found"; exit 1; fi; exec go run "$$MAIN_PACKAGE"; fi'
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/developer/.cache/go-build
    environment:
      - TZ=${TIMEZONE}
      - GO111MODULE=on
      - GOPROXY=${GOPROXY}
      - CGO_ENABLED=${GO_CGO_ENABLED}
      - PORT=8080
      - SERVER_PORT=8080
      - APP_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "8004:8080"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    tty: true
    networks:
      - frontend
      - backend
# END Go project: go-hoodly-joy-go


