<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Panel - Go</title>
<style>
:root{--bg:#f7f8fb;--panel:#fff;--panel-soft:#f9fafb;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--primary:#2563eb;--primary-soft:#dbeafe;--ok:#059669;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--danger:#dc2626;--danger-soft:#fee2e2;--r:8px;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.hidden{display:none!important}.topbar{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:36px;height:36px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{margin:0;font-size:18px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:12px}.actions,.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{min-height:36px;padding:0 12px;border-radius:7px;background:#f3f4f6;color:#374151;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.primary{background:var(--primary);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn-soft);color:#92400e}.btn.danger{background:var(--danger-soft);color:#991b1b}.btn.small{min-height:30px;padding:0 9px;font-size:12px}.layout{width:min(1480px,100%);margin:0 auto;padding:20px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.sidebar,.surface{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.sidebar{height:fit-content;padding:12px;position:sticky;top:84px}.nav{width:100%;height:42px;margin-bottom:4px;padding:0 12px;border-radius:7px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:space-between}.nav.active{background:var(--primary-soft);color:var(--primary);font-weight:700}.stack{display:grid;gap:18px;min-width:0}.surface{padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.head h2{margin:0;font-size:18px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-soft)}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:8px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.identity{display:flex;gap:10px;min-width:0}.avatar{width:38px;height:38px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.name{font-weight:800;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.badge{border-radius:999px;padding:4px 9px;background:#f3f4f6;color:#374151;font-size:12px;white-space:nowrap}.badge.ok{background:var(--ok-soft);color:#065f46}.badge.warn{background:var(--warn-soft);color:#92400e}.badge.err{background:var(--danger-soft);color:#991b1b}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.meta div{min-width:0;padding:8px;border-radius:7px;background:var(--panel-soft)}.meta span{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}.meta strong{font-size:13px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.empty{padding:24px;border:1px dashed #cbd5e1;border-radius:var(--r);color:var(--muted);text-align:center}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}table{width:100%;min-width:780px;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:var(--panel-soft);color:var(--muted)}tr:last-child td{border-bottom:0}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.44)}.modal.active{display:flex}.dialog{width:min(760px,100%);max-height:min(860px,92vh);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.dialog-head{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0;font-size:16px}.dialog-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}label{font-size:12px;color:#374151;font-weight:700}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:10px 11px;background:#fff;color:var(--text)}textarea{min-height:88px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.checks{display:flex;gap:8px;flex-wrap:wrap}.check{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;display:inline-flex;align-items:center;gap:6px}.check input{width:auto}.terminal{min-height:260px;max-height:58vh;overflow:auto;padding:14px;border-radius:var(--r);background:#0b1220;color:#d1d5db;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;line-height:1.55}
@media(max-width:900px){.topbar{padding:0 14px}.layout{grid-template-columns:1fr;padding:14px}.sidebar{position:static}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}}@media(max-width:560px){.metrics,.meta{grid-template-columns:1fr}.topbar{height:auto;min-height:64px;gap:10px;align-items:flex-start;flex-direction:column;padding-top:12px;padding-bottom:12px}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">Go</div><div><h1>Docker Panel</h1><span id="readyText">检查中</span></div></div>
  <div class="actions"><button class="btn" onclick="refreshAll()">刷新</button><button class="btn primary" onclick="openProjectDialog()">新增 Go 项目</button></div>
</header>
<div class="layout">
  <aside class="sidebar">
    <button class="nav active" data-tab="projects" onclick="showTab('projects')"><span>项目</span><small id="navProjectCount">0</small></button>
    <button class="nav" data-tab="environment" onclick="showTab('environment')"><span>环境</span><small id="navPresetCount">0</small></button>
    <button class="nav" data-tab="containers" onclick="showTab('containers')"><span>容器</span><small id="navContainerCount">0</small></button>
  </aside>
  <main class="stack">
    <section class="surface"><div class="metrics"><div class="metric"><span>Docker</span><strong id="metricDocker">-</strong></div><div class="metric"><span>项目</span><strong id="metricProjects">0</strong></div><div class="metric"><span>运行容器</span><strong id="metricRunning">0</strong></div><div class="metric"><span>Go 项目</span><strong id="metricGoProjects">0</strong></div></div></section>
    <section class="surface tab-panel" id="tab-projects"><div class="head"><div><h2>Go 项目</h2><p>服务端口直出，本地不经过 Nginx。</p></div><div class="toolbar"><button class="btn" onclick="refreshProjects()">刷新项目</button><button class="btn primary" onclick="openProjectDialog()">新增 Go 项目</button></div></div><div id="projectList" class="grid"></div></section>
    <section class="surface tab-panel hidden" id="tab-environment"><div class="head"><div><h2>环境</h2><p>按需启动基础依赖。</p></div><div class="toolbar"><button class="btn" onclick="refreshEnvironment()">刷新环境</button><button class="btn danger" onclick="stopAllContainers()">停止全部</button></div></div><div id="presetList" class="grid"></div></section>
    <section class="surface tab-panel hidden" id="tab-containers"><div class="head"><div><h2>容器</h2><p>当前 Docker 状态。</p></div><button class="btn" onclick="refreshContainers()">刷新容器</button></div><div class="table-wrap"><table><thead><tr><th>名称</th><th>状态</th><th>镜像</th><th>端口</th><th>操作</th></tr></thead><tbody id="containerRows"></tbody></table></div></section>
  </main>
</div>
<div class="modal" id="projectModal"><div class="dialog"><div class="dialog-head"><h3>新增 Go 项目</h3><button class="btn small" onclick="closeProjectDialog()">关闭</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label for="projectKey">项目标识</label><input id="projectKey" placeholder="hoodly-joy-go" oninput="syncProjectDefaults()"></div><div class="field"><label for="projectName">项目名称</label><input id="projectName" placeholder="Hoodly Joy Go"></div><div class="field wide"><label for="projectPath">容器内项目路径</label><input id="projectPath" placeholder="/develop/Hua/Projects/hoodly-joy/go-service"></div><div class="field"><label for="projectPort">宿主机端口</label><input id="projectPort" type="number" min="1024" max="65535" value="8081"></div><div class="field"><label for="projectUrl">访问地址</label><input id="projectUrl" placeholder="http://localhost:8081"></div><div class="field wide"><label>依赖服务</label><div class="checks"><label class="check"><input type="checkbox" value="redis" class="project-dep">Redis</label><label class="check"><input type="checkbox" value="mysql" class="project-dep">MySQL</label><label class="check"><input type="checkbox" value="rabbitmq" class="project-dep">RabbitMQ</label></div></div><div class="field wide"><label for="projectCommand">启动命令</label><textarea id="projectCommand" placeholder="留空时自动选择 go run . 或 cmd 入口"></textarea></div></div><div class="actions"><button class="btn" onclick="previewProject()">预览</button><button class="btn ok" onclick="saveProject()">生成并保存</button><button class="btn" onclick="clearProjectForm()">清空</button></div></div></div></div>
<div class="modal" id="terminalModal"><div class="dialog"><div class="dialog-head"><h3 id="terminalTitle">任务日志</h3><button class="btn small" onclick="closeTerminal()">关闭</button></div><div class="dialog-body"><div id="terminalBody" class="terminal"></div></div></div></div>
<script>
const state={projects:[],containers:[],presets:[],terminalToken:0};
async function api(path,options={}){const res=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({success:false,error:res.statusText}));if(!res.ok||data.success===false)throw new Error(data.error||res.statusText||'请求失败');return data.data??data}
function text(id,v){const el=document.getElementById(id);if(el)el.textContent=v}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function arg(v){return JSON.stringify(String(v??''))}
function part(v){return String(v||'project').trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'project'}
function initials(p){return String(p.name||p.key||'GO').trim().slice(0,2).toUpperCase()}
function showTab(tab){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));document.getElementById('tab-'+tab)?.classList.remove('hidden')}
async function refreshAll(){await Promise.allSettled([refreshReady(),refreshProjects(),refreshContainers(),refreshEnvironment()]);renderMetrics()}
async function refreshReady(){try{const r=await api('/ready');const docker=(r.checks||[]).find(i=>i.name==='docker');text('readyText','Go 面板已就绪');text('metricDocker',docker?.status==='ok'?'可用':'检查')}catch(e){text('readyText',e.message);text('metricDocker','异常')}}
async function refreshProjects(){try{const d=await api('/projects');state.projects=(d.projects||[]).filter(p=>p.type==='go')}catch(e){state.projects=[];inlineError('projectList',e.message)}renderProjects();renderMetrics()}
async function refreshContainers(){try{const d=await api('/containers');state.containers=d.containers||[]}catch(e){state.containers=[];document.getElementById('containerRows').innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`}renderContainers();renderMetrics()}
async function refreshEnvironment(){try{const d=await api('/env/presets');state.presets=d.presets||[]}catch(e){state.presets=[];inlineError('presetList',e.message)}renderPresets();renderMetrics()}
function renderMetrics(){const running=state.containers.filter(i=>i.state==='running').length;const go=state.projects.filter(i=>i.type==='go').length;text('metricProjects',state.projects.length);text('metricRunning',running);text('metricGoProjects',go);text('navProjectCount',state.projects.length);text('navContainerCount',state.containers.length);text('navPresetCount',state.presets.length)}
function inlineError(id,msg){const el=document.getElementById(id);if(el)el.innerHTML=`<div class="empty">${esc(msg)}</div>`}
function projectServices(p){return Array.isArray(p.services)?p.services:[]}
function renderProjects(){const list=document.getElementById('projectList');if(!list)return;if(!state.projects.length){list.innerHTML='<div class="empty">暂无 Go 项目</div>';return}list.innerHTML=state.projects.map(renderProjectCard).join('')}
function renderProjectCard(p){const st=p.status||{};const active=!!st.active;const services=projectServices(p);const running=Number(st.servicesRunning||0);const total=Number(st.servicesTotal||services.length||0);const url=p.url||(p.port?`http://localhost:${p.port}`:'');const badge=active?'<span class="badge ok">运行中</span>':`<span class="badge warn">${running}/${total||services.length} 已运行</span>`;const chips=services.length?services.map(s=>`<span class="chip">${esc(s)}</span>`).join(''):'<span class="chip">go</span>';const ops=`<button class="btn small ok" onclick="startProject(${arg(p.key)})">启动</button><button class="btn small warn" onclick="restartProject(${arg(p.key)})">重启</button><button class="btn small danger" onclick="stopProject(${arg(p.key)})">停止</button><button class="btn small" onclick="runProjectCommand(${arg(p.key)},'go-version')">Go 版本</button><button class="btn small" onclick="runProjectCommand(${arg(p.key)},'go-mod-download')">下载依赖</button><button class="btn small" onclick="runProjectCommand(${arg(p.key)},'build')">构建</button><button class="btn small" onclick="runProjectCommand(${arg(p.key)},'test')">测试</button><button class="btn small" onclick="showProjectLogs(${arg(p.key)})">日志</button><button class="btn small" onclick="runCustomProjectCommand(${arg(p.key)})">命令</button>${url?`<button class="btn small primary" onclick="window.open(${arg(url)},'_blank')">打开</button>`:''}`;return `<article class="card"><div class="card-head"><div class="identity"><div class="avatar">${esc(initials(p))}</div><div><div class="name">${esc(p.name||p.key||'未命名')}</div><div class="sub">${esc(p.key||'')}</div></div></div>${badge}</div><div class="meta"><div><span>路径</span><strong>${esc(p.path||'-')}</strong></div><div><span>端口</span><strong>${esc(p.port||'-')}</strong></div><div><span>访问</span><strong>${esc(url||'-')}</strong></div><div><span>运行时</span><strong>Go container 8080</strong></div></div><div class="chips">${chips}</div><div class="actions">${ops}<button class="btn small" onclick="editProject(${arg(p.key)})">编辑</button><button class="btn small danger" onclick="deleteProject(${arg(p.key)})">删除环境</button></div></article>`}
function renderPresets(){const list=document.getElementById('presetList');if(!list)return;if(!state.presets.length){list.innerHTML='<div class="empty">暂无预设</div>';return}list.innerHTML=state.presets.map(p=>`<article class="card"><div class="card-head"><div><div class="name">${esc(p.name||p.key)}</div><div class="sub">${esc(p.description||'')}</div></div><span class="badge">${esc(p.icon||'ENV')}</span></div><div class="chips">${(p.services||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><div class="actions"><button class="btn small ok" onclick="startEnvironment(${arg(p.key)})">启动</button></div></article>`).join('')}
function renderContainers(){const rows=document.getElementById('containerRows');if(!rows)return;if(!state.containers.length){rows.innerHTML='<tr><td colspan="5">暂无容器</td></tr>';return}rows.innerHTML=state.containers.map(c=>{const running=c.state==='running';const ports=Array.isArray(c.ports)?c.ports.map(p=>p.publicPort?`${p.publicPort}:${p.privatePort}`:p.privatePort).join(', '):'';return `<tr><td><strong>${esc(c.name||c.id||'-')}</strong><div class="sub">${esc(c.id||'')}</div></td><td><span class="badge ${running?'ok':'warn'}">${esc(c.state||'-')}</span><div class="sub">${esc(c.status||'')}</div></td><td>${esc(c.image||'-')}</td><td>${esc(ports||'-')}</td><td><div class="toolbar">${running?`<button class="btn small warn" onclick="containerAction(${arg(c.id)},'restart')">重启</button><button class="btn small danger" onclick="containerAction(${arg(c.id)},'stop')">停止</button>`:`<button class="btn small ok" onclick="containerAction(${arg(c.id)},'start')">启动</button>`}<button class="btn small" onclick="showContainerLogs(${arg(c.id)},${arg(c.name||c.id)})">日志</button></div></td></tr>`}).join('')}
function openProjectDialog(){clearProjectForm();document.getElementById('projectModal').classList.add('active');document.getElementById('projectKey').focus()}
function closeProjectDialog(){document.getElementById('projectModal').classList.remove('active')}
function deps(){return Array.from(document.querySelectorAll('.project-dep:checked')).map(i=>i.value)}
function readProjectForm(){const key=part(document.getElementById('projectKey').value);const port=Number(document.getElementById('projectPort').value||0);return{type:'go',key,name:document.getElementById('projectName').value.trim()||key,path:document.getElementById('projectPath').value.trim(),port,services:deps(),command:document.getElementById('projectCommand').value.trim(),url:document.getElementById('projectUrl').value.trim()||(port?`http://localhost:${port}`:'')}}
function validateProject(p){if(!p.key||!p.path){alert('请填写项目标识和项目路径');return false}if(p.port<1024||p.port>65535){alert('端口需要在 1024 到 65535 之间');return false}return true}
function syncProjectDefaults(){const key=part(document.getElementById('projectKey').value);const name=document.getElementById('projectName');const path=document.getElementById('projectPath');if(key&&!name.value.trim())name.value=key;if(key&&(!path.value.trim()||path.dataset.auto==='1')){path.value=`/develop/${key}`;path.dataset.auto='1'}}
function syncProjectUrl(force=false){const port=Number(document.getElementById('projectPort').value||0);const url=document.getElementById('projectUrl');if(port&&(force||!url.value.trim()))url.value=`http://localhost:${port}`}
function clearProjectForm(){document.getElementById('projectKey').value='';document.getElementById('projectName').value='';document.getElementById('projectPath').value='';document.getElementById('projectPath').dataset.auto='';document.getElementById('projectPort').value='8081';document.getElementById('projectCommand').value='';document.querySelectorAll('.project-dep').forEach(i=>i.checked=false);syncProjectUrl(true)}
async function previewProject(){const p=readProjectForm();if(!validateProject(p))return;openTerminal('预览项目配置');writeTerminal(`$ project scaffold --dry-run ${p.key}\n`);try{const r=await api('/project-scaffold',{method:'POST',body:JSON.stringify({...p,dryRun:true})});printScaffold(r,true)}catch(e){writeTerminal(e.message+'\n')}}
async function saveProject(){const p=readProjectForm();if(!validateProject(p))return;openTerminal('生成项目环境');writeTerminal(`$ project scaffold ${p.key}\n`);try{const r=await api('/project-scaffold',{method:'POST',body:JSON.stringify(p)});printScaffold(r,false);closeProjectDialog();await refreshProjects()}catch(e){writeTerminal(e.message+'\n')}}
function printScaffold(r,dry){(r.actions||[]).forEach(i=>writeTerminal('- '+i+'\n'));if(r.compose)writeTerminal(`Compose: ${r.compose.service} ${r.compose.hostPort}:${r.compose.containerPort}\n`);writeTerminal(dry?'预览完成\n':'配置已生成\n')}
async function editProject(key){const p=state.projects.find(i=>i.key===key);if(!p){alert('项目不存在');return}document.getElementById('projectKey').value=p.key||'';document.getElementById('projectName').value=p.name||'';document.getElementById('projectPath').value=p.path||'';document.getElementById('projectPath').dataset.auto='';document.getElementById('projectPort').value=p.port||8081;document.getElementById('projectUrl').value=p.url||'';document.getElementById('projectCommand').value=p.command||'';const set=new Set(p.services||[]);document.querySelectorAll('.project-dep').forEach(i=>i.checked=set.has(i.value));syncProjectUrl(false);document.getElementById('projectModal').classList.add('active')}
async function startProject(key){await runProjectTask(key,'start-task','启动项目')}
async function restartProject(key){await runProjectTask(key,'restart-task','重启项目')}
async function runProjectTask(key,action,title){openTerminal(`${title}: ${key}`);writeTerminal(`$ project ${action} ${key}\n`);try{const t=await api(`/projects/${encodeURIComponent(key)}/${action}`,{method:'POST'});if(!t.taskId){writeTerminal('任务没有返回 taskId\n');return}await pollTask(t.taskId);await refreshAll()}catch(e){writeTerminal(e.message+'\n')}}
async function stopProject(key){openTerminal(`停止项目: ${key}`);writeTerminal(`$ project stop ${key}\n`);try{const r=await api(`/projects/${encodeURIComponent(key)}/stop`,{method:'POST'});writeTerminal((r.output||'已停止')+'\n');await refreshAll()}catch(e){writeTerminal(e.message+'\n')}}
async function deleteProject(key){if(!confirm('确定删除这个项目环境记录吗？不会删除项目源码。'))return;openTerminal(`删除项目环境: ${key}`);try{const r=await api(`/projects/${encodeURIComponent(key)}/delete-environment`,{method:'POST',body:JSON.stringify({removeContainer:true,removeCompose:true})});(r.actions||[]).forEach(i=>writeTerminal('- '+i+'\n'));(r.warnings||[]).forEach(i=>writeTerminal('warning: '+i+'\n'));if(r.output)writeTerminal(r.output+'\n');await refreshAll()}catch(e){writeTerminal(e.message+'\n')}}
async function runProjectCommand(key,command,custom=''){openTerminal(`运行命令: ${key}`);writeTerminal(`$ ${custom||command}\n`);try{const r=await api(`/projects/${encodeURIComponent(key)}/run`,{method:'POST',body:JSON.stringify({command,custom})});writeTerminal((r.output||'')+'\n')}catch(e){writeTerminal(e.message+'\n')}}
function runCustomProjectCommand(key){const command=prompt('输入要在项目容器中执行的命令');if(command)runProjectCommand(key,'custom',command)}
async function showProjectLogs(key){openTerminal(`项目日志: ${key}`);try{const r=await api(`/projects/${encodeURIComponent(key)}/logs`);writeTerminal((r.logs||'暂无日志')+'\n')}catch(e){writeTerminal(e.message+'\n')}}
async function startEnvironment(key){openTerminal(`启动环境: ${key}`);writeTerminal(`$ env start ${key}\n`);try{const t=await api(`/env/start/${encodeURIComponent(key)}`,{method:'POST'});if(t.taskId)await pollTask(t.taskId);await refreshAll()}catch(e){writeTerminal(e.message+'\n')}}
async function stopAllContainers(){if(!confirm('确定停止所有开发容器吗？面板自身会保留。'))return;openTerminal('停止全部容器');try{const r=await api('/env/stop-all',{method:'POST'});writeTerminal(JSON.stringify(r.results||r,null,2)+'\n');await refreshAll()}catch(e){writeTerminal(e.message+'\n')}}
async function containerAction(id,action){openTerminal(`容器 ${action}`);try{await api(`/containers/${encodeURIComponent(id)}/${action}`,{method:'POST'});writeTerminal('操作完成\n');await refreshContainers()}catch(e){writeTerminal(e.message+'\n')}}
async function showContainerLogs(id,name){openTerminal(`容器日志: ${name}`);try{const r=await api(`/containers/${encodeURIComponent(id)}/logs?tail=200`);writeTerminal((r.logs||'暂无日志')+'\n')}catch(e){writeTerminal(e.message+'\n')}}
function openTerminal(title){state.terminalToken++;text('terminalTitle',title);document.getElementById('terminalBody').textContent='';document.getElementById('terminalModal').classList.add('active')}
function closeTerminal(){state.terminalToken++;document.getElementById('terminalModal').classList.remove('active')}
function writeTerminal(v){const b=document.getElementById('terminalBody');b.textContent+=v;b.scrollTop=b.scrollHeight}
async function pollTask(taskId){const token=state.terminalToken;let offset=0;while(token===state.terminalToken){const t=await api(`/project-tasks/${encodeURIComponent(taskId)}?offset=${offset}`);if(t.output)writeTerminal(t.output);if(typeof t.offset==='number')offset=t.offset;if(t.status==='success'||t.status==='failed'){writeTerminal(`\n任务状态: ${t.status}\n`);return t}await new Promise(r=>setTimeout(r,1000))}}
document.getElementById('projectPath')?.addEventListener('input',e=>{e.target.dataset.auto=''});
document.getElementById('projectPort')?.addEventListener('input',()=>syncProjectUrl(true));
document.getElementById('projectModal')?.addEventListener('click',e=>{if(e.target.id==='projectModal')closeProjectDialog()});
document.getElementById('terminalModal')?.addEventListener('click',e=>{if(e.target.id==='terminalModal')closeTerminal()});
refreshAll();
</script>
</body>
</html>
